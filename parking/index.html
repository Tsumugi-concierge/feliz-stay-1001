<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking — Feliz Stay 1001</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#d4651e; --accent-light:#fcd3ae; --cream:#fdf6ee; --text-dark:#3a3232; --text-mid:#6b5a5a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Nunito',sans-serif; background:var(--cream); color:var(--text-dark); min-height:100vh; }
    .top-bar { background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,black) 100%); padding:16px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; box-shadow:0 2px 12px rgba(0,0,0,.15); }
    .back-btn { background:rgba(255,255,255,.25); border:none; border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:#fff; text-decoration:none; font-size:1.2rem; }
    .top-emoji { font-size:1.8rem; }
    .top-title { flex:1; color:#fff; font:1.3rem 'Pacifico',cursive; text-shadow:1px 2px 4px rgba(0,0,0,.2); }
    .content { max-width:600px; margin:0 auto; padding:20px 16px 40px; }
    .info-card { margin:18px 0; padding:16px 18px; border-radius:14px; background:#fff; box-shadow:0 2px 12px rgba(120,80,60,.08); color:var(--text-mid); font-size:.95rem; line-height:1.7; }
    .back-footer { margin-top:28px; padding-bottom:20px; text-align:center; }
    .back-footer a { display:inline-flex; padding:12px 28px; border-radius:50px; background:var(--accent); color:#fff; text-decoration:none; box-shadow:0 4px 12px rgba(0,0,0,.2); font-size:.9rem; font-weight:800; }
  </style>
  <link rel="stylesheet" href="../assets/style-sub.css">
  <link rel="stylesheet" href="../assets/cute-pack.css">
  <link rel="stylesheet" href="../assets/i18n.css">
  <style id="cute-pack-theme">:root{--cp-chip-a:#fff3e8;--cp-chip-b:#fdeef4;--cp-hover-shadow:rgba(220,140,90,.18);--cp-dot-1:rgba(240,170,120,.10);}</style>
  </head>
<body>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ja">JA</button>
    <button class="lang-btn" data-lang="zh">ZH</button>
    <button class="lang-btn" data-lang="ko">KO</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="es">ES</button>
  </div>
  <div class="top-bar">
    <a href="../" class="back-btn" aria-label="Back">←</a>
    <span class="top-emoji">🚗</span>
    <div class="top-title" data-i18n="pageTitle">Parking</div>
  </div>
  <main class="content">
    <div class="info-card">
      <h3 data-i18n="infoTitle">Parking Information</h3>
      <p data-i18n="infoBody">Parking is not included with your stay. Please use paid parking lots in the area. Check Google Maps for nearby options.</p>
    </div>
    <div class="back-footer"><a href="../" data-i18n="backToMenu">← Back to Menu</a></div>
  </main>
  <script>
    const S = {
      en: {
        pageTitle: 'Parking',
        infoTitle: 'Parking Information',
        infoBody: 'Parking is not included with your stay. Please use paid parking lots in the area. Check Google Maps for nearby options.',
        backToMenu: '← Back to Menu',
      },
      ja: {
        pageTitle: '駐車場',
        infoTitle: '駐車場について',
        infoBody: '駐車場は宿泊に含まれておりません。近隣のコインパーキングをご利用ください。Googleマップで近くの駐車場を検索できます。',
        backToMenu: '← メニューへ戻る',
      },
      zh: {
        pageTitle: '停车场',
        infoTitle: '停车信息',
        infoBody: '住宿不含停车位。请使用附近的收费停车场。可通过Google地图查找附近的停车场。',
        backToMenu: '← 返回菜单',
      },
      ko: {
        pageTitle: '주차장',
        infoTitle: '주차 안내',
        infoBody: '숙박에 주차 공간은 포함되어 있지 않습니다. 근처 유료 주차장을 이용해 주세요. Google 지도에서 근처 주차장을 검색하세요.',
        backToMenu: '← 메뉴로 돌아가기',
      },
      fr: {
        pageTitle: 'Parking',
        infoTitle: 'Informations parking',
        infoBody: "Le parking n'est pas inclus dans le sejour. Veuillez utiliser les parkings payants du quartier. Consultez Google Maps pour les options proches.",
        backToMenu: '← Retour au menu',
      },
      es: {
        pageTitle: 'Estacionamiento',
        infoTitle: 'Informacion de estacionamiento',
        infoBody: 'El estacionamiento no esta incluido en la estadia. Use los estacionamientos de pago del area. Consulte Google Maps para opciones cercanas.',
        backToMenu: '← Volver al menu',
      },
    };
  </script>
  <script src="../assets/i18n.js"></script>
  <script> I18N.init({ strings: S }); </script>
  <script src="../assets/cute-pack.js" defer></script>
</body>
</html>
